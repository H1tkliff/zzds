name: CI

# push only on master, otherwise a branch with an open PR runs everything twice
on:
  push:
    branches: [master]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-retries=10
    env:
      # PHP runs directly on the runner, not in the docker-compose network → 127.0.0.1 instead of "database"
      # (real environment variables take precedence over .env.test)
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/symfony_app?serverVersion=8.0.32&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, intl, zip
      - run: composer install --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      # phpstan-symfony reads var/cache/dev/App_KernelDevDebugContainer.xml
      - run: php bin/console cache:warmup --env=dev
      - run: vendor/bin/phpstan analyse --no-progress
      - name: Test database
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate -n --env=test
          php bin/console doctrine:fixtures:load -n --env=test
      - run: php bin/phpunit
